<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои расходы</title>
</head>
<body>

    <h1>Мои расходы</h1>

    <input
        type="text"
        id="expenseName"
        placeholder="Название расхода"
    >

    <input
        type="number"
        id="expenseAmount"
        placeholder="Сумма"
    >

    <button id="add">Добавить</button>
    <button id="clear">Очистить всё</button>

    <h2 id="total">Общая сумма: 0 тг</h2>

    <ul id="expenses"></ul>

    <script src="script.js"></script>

</body>
</html>
